services:
  db:
    image: postgres:16
    container_name: movietrack_db
    restart: always
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: Pass123$$
      POSTGRES_DB: movietrack_db
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d movietrack_db"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - movienet

