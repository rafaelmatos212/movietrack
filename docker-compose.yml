version: '3.9'

services:
  db:
    image: postgres:latest
    container_name: movietrack_db
    restart: always
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: Pass123$
      POSTGRES_DB: movietrack_db
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - movienet

